[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backuper"
version = "1.8.1"
description = "Pull backups from SQL Server, MikroTik, SMB/SFTP/FTP folders and hosting panels, zip them with AES-256, archive them and ship them to Telegram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.40,<2",
    "cryptg>=0.4",
    "python-socks[asyncio]>=2.4",
    "smbprotocol>=1.13",
    "asyncssh>=2.14",
    "pymssql>=2.3",
    "pyzipper>=0.3.6",
    "jdatetime>=5.0",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "cryptography>=42",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
backuper = "backuper.cli:main"

[tool.setuptools.packages.find]
include = ["backuper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
