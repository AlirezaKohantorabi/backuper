# Example for `backuper import <file>`. Re-importing updates sources by name.
# Passwords may be left empty here and set later in the bot (🔑 Credentials).

settings:
  archive_path: '\\10.0.0.5\Backups'        # or a local folder like /srv/backups
  archive_credential: fileserver
  archive_keep_days: 14
  topic_mode: category                      # category | source | none

groups:                                     # each group starts at its time; uploads smallest file first
  - name: Daily
    schedule: "08:00"                       # or "08:00, 20:00" or cron "0 8 * * 6"
  - name: Night
    schedule: "01:00"

credentials:
  - name: fileserver
    username: 'CORP\svc-backup'
    password: ''
  - name: sql-backup
    username: backuper
    password: ''
  - name: mikrotik-bot
    username: backuper
    password: ''
  - name: cpanel-example
    username: examplecom                 # cPanel username; password = API token
    password: ''
  - name: ftp-example
    username: examplecom
    password: ''

sources:
  - name: ERP
    type: mssql_collect
    group: Daily
    share: '\\10.0.0.10\SQLBackup'
    credential: fileserver
    patterns: ['*.bak']
    group_by: database
    keep_last: 14

  - name: Accounting
    type: mssql_trigger
    group: Daily
    host: 10.0.0.11
    sql_credential: sql-backup
    databases: ['*']
    server_dir: 'D:\SQLBackup'
    share: '\\10.0.0.11\SQLBackup'
    share_credential: fileserver
    keep_last: 7

  - name: Core-Router
    type: mikrotik
    group: Daily
    host: 10.0.0.1
    credential: mikrotik-bot

  - name: Finance-Docs
    type: smb_folder
    group: Night
    telegram: false                      # archive only
    path: '\\10.0.0.5\D$\Finance'
    credential: fileserver

  - name: Website
    type: cpanel
    host: example.com
    credential: cpanel-example           # username + API token
    auth: token
    transfer: ftps
    transfer_credential: ftp-example     # cPanel FTP login
    schedule: "0 4 * * 5"                # no group: its own time, Fridays 04:00
